<nav class="nav">
  <div class="brand">🏥 HMS <span>↔</span> LIS</div>
  <a class="link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
  <a class="link" routerLink="/patients" routerLinkActive="active">Patients</a>
  <a class="link" routerLink="/lab-requests" routerLinkActive="active">Lab Requests</a>
  <a class="link" routerLink="/orders" routerLinkActive="active">LIS Orders</a>
  <a class="link" routerLink="/catalog" routerLinkActive="active">Catalog</a>
  <a class="link" routerLink="/logs" routerLinkActive="active">Transaction Log</a>
  <div class="spacer"></div>

  <span class="chip" [class.on]="auth.isLoggedIn('hms')" [title]="auth.username('hms') || 'Not logged in'">
    <span class="dot"></span> HMS
  </span>
  <span class="chip" [class.on]="auth.isLoggedIn('lab')" [title]="auth.username('lab') || 'Not logged in'">
    <span class="dot"></span> Lab
  </span>

  @if (auth.isActiveLoggedIn()) {
    <button class="mini" (click)="logoutAll()">Log out</button>
  } @else {
    <a class="link" routerLink="/login">Login</a>
  }
</nav>

<router-outlet />
